<!DOCTYPE html>
<html lang="be">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Тэст: Правапіс мяккага знака і апострафа</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f5f7fa;
            font-family: 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            padding: 30px 20px;
            color: #1e293b;
        }

        .container {
            max-width: 950px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 32px;
            box-shadow: 0 20px 35px -12px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            padding: 20px 28px 40px;
            transition: all 0.2s;
        }

        h1 {
            font-size: 1.9rem;
            text-align: center;
            margin-bottom: 8px;
            color: #0f3b5c;
            letter-spacing: -0.3px;
        }

        .sub {
            text-align: center;
            font-size: 1rem;
            color: #2c5a7a;
            border-bottom: 2px solid #e2edf7;
            padding-bottom: 18px;
            margin-bottom: 28px;
        }

        .question-card {
            background: #fefefe;
            border-radius: 28px;
            padding: 20px 24px;
            margin-bottom: 28px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.03), 0 1px 3px rgba(0, 0, 0, 0.05);
            border: 1px solid #e9f0f5;
            transition: 0.1s;
        }

        .q-title {
            font-weight: 700;
            font-size: 1.3rem;
            background: #eef3fc;
            display: inline-block;
            padding: 4px 16px;
            border-radius: 60px;
            margin-bottom: 16px;
            color: #155f8b;
        }

        .q-text {
            font-weight: 600;
            font-size: 1.18rem;
            margin: 12px 0 16px 0;
            line-height: 1.4;
        }

        .options {
            margin: 12px 0 8px;
            padding-left: 12px;
        }

        .option {
            margin: 12px 0;
            display: flex;
            align-items: flex-start;
            gap: 12px;
            flex-wrap: wrap;
        }

        .option label {
            font-size: 1rem;
            line-height: 1.4;
            color: #1f3a4b;
            font-weight: 500;
            cursor: pointer;
        }

        input[type="radio"], input[type="checkbox"] {
            width: 18px;
            height: 18px;
            margin-top: 2px;
            accent-color: #2c7cb6;
            cursor: pointer;
        }

        .text-input {
            margin-top: 12px;
        }

        .text-input input {
            width: 100%;
            max-width: 360px;
            padding: 12px 16px;
            font-size: 1rem;
            border-radius: 48px;
            border: 1.5px solid #cbdde9;
            background: white;
            transition: 0.2s;
            font-family: inherit;
        }

        .text-input input:focus {
            border-color: #2c7cb6;
            outline: none;
            box-shadow: 0 0 0 3px rgba(44,124,182,0.2);
        }

        .btn-group {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 30px 0 25px;
            flex-wrap: wrap;
        }

        button {
            background: #1f6e9c;
            border: none;
            padding: 12px 32px;
            font-size: 1.05rem;
            font-weight: 600;
            color: white;
            border-radius: 60px;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            font-family: inherit;
        }

        button:hover {
            background: #0e577f;
            transform: scale(0.98);
        }

        .reset-btn {
            background: #4b6a7c;
        }
        .reset-btn:hover {
            background: #2c4b5e;
        }

        .results {
            background: #eef4fa;
            border-radius: 28px;
            padding: 20px 26px;
            margin-top: 20px;
            border-left: 6px solid #1f6e9c;
        }

        .score {
            font-size: 1.65rem;
            font-weight: 800;
            margin-bottom: 16px;
        }

        .explanation {
            margin-top: 18px;
            border-top: 1px solid #bfd8ec;
            padding-top: 16px;
        }

        .exp-item {
            background: #ffffffcb;
            margin: 12px 0;
            padding: 12px 18px;
            border-radius: 20px;
            font-size: 0.95rem;
            line-height: 1.45;
        }

        .correct-badge {
            color: #116b2f;
            font-weight: 700;
        }

        .wrong-badge {
            color: #b13e3e;
            font-weight: 700;
        }

        hr {
            margin: 16px 0;
            border: 0;
            height: 1px;
            background: #cde1ef;
        }

        footer {
            text-align: center;
            font-size: 0.75rem;
            margin-top: 20px;
            color: #5f7f9a;
        }
        @media (max-width: 650px) {
            .container {
                padding: 15px 18px 30px;
            }
            .q-text {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>📖 Правапіс мяккага знака і апострафа</h1>
    <div class="sub">Тэст з 10 пытанняў · Растлумачэнні пасля праверкі</div>

    <form id="quizForm">
        <!-- Пытанні будуць устаўлены дынамічна праз JS -->
    </form>

    <div class="btn-group">
        <button type="button" id="checkBtn">✅ Праверыць адказы</button>
        <button type="button" id="resetBtn" class="reset-btn">⟳ Ачысціць усё</button>
    </div>

    <div id="resultsArea" class="results" style="display: none;"></div>
</div>

<script>
    // ---------- ДАНЫЯ ТЭСТУ ----------
    const questionsData = [
        { // 1 - адзін адказ
            type: 'single',
            text: 'У якім слове трэба пісаць апостраф?',
            options: ['Уз..езд', 'Міл..ён', 'Кан..ён', 'Л..ецца'],
            correct: ['Уз..езд'],
            explanation: '📌 Правіла: апостраф пішацца пасля прыставак, якія заканчваюцца на зычны, перад я, ю, е, ё (уз`езд, аб`езд). У слове «уз`езд» — правільна. Іншыя словы не патрабуюць апострафа або пішуцца з мяккім знакам.'
        },
        { // 2 - адзін адказ
            type: 'single',
            text: 'Дзе трэба ўставіць мяккі знак (Ь)?',
            options: ['Голуб..', 'Любан..скі', 'Піс..мо', 'Аб..ём'],
            correct: ['Піс..мо'],
            explanation: '📌 Правіла: мяккі знак пішацца ў слове "пісьмо" (каб абазначыць мяккасць зычнага). У іншых варыянтах ён не патрэбны (напрыклад, "голуб" пішацца без мяккага знака).'
        },
        { // 3 - некалькі адказаў
            type: 'multiple',
            text: 'Выберыце словы, якія пішуцца з апострафам.',
            options: ['Між..ярусны', 'Бур..ян', 'Кур..ер', 'Сем..я', 'Пед..інстытут'],
            correct: ['Між..ярусны', 'Бур..ян', 'Кур..ер', 'Сем..я'],
            explanation: '✅ Правіла: апостраф ставіцца перад я, ю, е, ё пасля зычных (у т.л. пасля прыставак, а таксама ў сярэдзіне слоў: бур’ян, кур’ер, сям’я). «Педінстытут» пішацца без апострафа, бо галосная і не патрабуе.'
        },
        { // 4
            type: 'multiple',
            text: 'Дзе неабходна пісаць мяккі знак?',
            options: ['Ноч..', 'Малац..ба', 'Змен..шчык', 'П..еса', 'Барац..ба'],
            correct: ['Малац..ба', 'Барац..ба'],
            explanation: '📖 Правіла: мяккі знак пішацца: 1) для пазначэння мяккасці; 2) у складаных выпадках; 3) раздзяляльны мяккі знак.'
        },
        { // 5
            type: 'multiple',
            text: 'У якіх словах трэба ўжываць апостраф?',
            options: ['Аб..езд', 'Верас..нёвы', 'Мыш..як', 'Разал..е', 'Трох..ярусны'],
            correct: ['Аб..езд', 'Мыш..як', 'Трох..ярусны'],
            explanation: '📌 Правіла: апостраф пішацца: пасля прыстаўкі "аб-" (аб`езд), у слове "мыш\'як" (памякчэнне, падваенне), а таксама "трох\'ярусны". "Вераснёвы" — без апострафа (нё вымаўл. злітна).'
        },
        { // 6
            type: 'multiple',
            text: 'Выберыце словы, у якіх мяккі знак ўжыты правільна:',
            options: ['Пісьменнік', 'Канькі', 'Вучань', 'Сьвёкар', 'Васількавы'],
            correct: ['Пісьменнік', 'Канькі', 'Вучань', 'Васількавы'],
            explanation: '📌 Правіла: пісьменнік, канькі, учань, васількавы - мяккасць мяккасці зычнага.'
        },
        { // 7
            type: 'multiple',
            text: 'Дзе патрэбны апостраф?',
            options: ['Пад..езд', 'В..юн', 'Дз..юна', 'Любоў..ю', 'Салаў..і'],
            correct: ['Пад..езд', 'В..юн'],
            explanation: '📌 Правіла: апостраф ставіцца перад е, ё, ю, я пасля цвёрдых зычных.'
        },
        { // 8
            type: 'multiple',
            text: 'Якія словы пішуцца праз мяккі знак?',
            options: ['Малац..ба', 'Рэдз..ка', 'Пес..ня', 'Дз..ве', 'Насып..'],
            correct: ['Малац..ба', 'Рэдз..ка'],
            explanation: '📌 Правіла: мяккі знак пішацца: малацьба, рэдзька (перад цвёрдым зычным)'
        },
        { // 9 - тэкставы адказ
            type: 'text',
            text: 'Напішыце слова правільна (з апострафам або мяккім знакам): сям\..я',
            correct: ["сям'я", "сям’я"],
            explanation: '📌 У беларускай мове пасля зычнай "м" перад "я" абавязкова ставіцца апостраф.'
        },
        { // 10 - тэкставы адказ
            type: 'text',
            text: 'Устаўце патрэбны знак у слове: "з..ява"',
            correct: ["з'ява", "з’ява"],
            explanation: '📌 Правільна: з’ява. Пасля прыстаўкі "з-" перад "я" абавязкова ставіцца апостраф, бо гэта цвёрды зычны.'
        }
    ];

    // Рэндэр форма
    const formContainer = document.getElementById('quizForm');
    
    function renderQuiz() {
        let html = '';
        questionsData.forEach((q, idx) => {
            const qNumber = idx+1;
            html += `<div class="question-card" data-qidx="${idx}">`;
            html += `<div class="q-title">Пытанне ${qNumber}</div>`;
            html += `<div class="q-text">${q.text}</div>`;
            html += `<div class="options" id="options-${idx}">`;

            if (q.type === 'single' || q.type === 'multiple') {
                const inputType = (q.type === 'single') ? 'radio' : 'checkbox';
                const nameAttr = (q.type === 'single') ? `q${idx}` : `q${idx}_cb`;
                q.options.forEach((opt, optIdx) => {
                    const optId = `q${idx}_opt${optIdx}`;
                    html += `<div class="option">
                                <input type="${inputType}" name="${nameAttr}" value="${opt.replace(/"/g, '&quot;')}" id="${optId}">
                                <label for="${optId}">${opt}</label>
                            </div>`;
                });
            } 
            else if (q.type === 'text') {
                html += `<div class="text-input">
                            <input type="text" id="text-${idx}" placeholder="Увядзіце адказ..." autocomplete="off">
                         </div>`;
            }
            html += `</div></div>`;
        });
        formContainer.innerHTML = html;
    }

    // збор адказаў карыстальніка
    function getUserAnswers() {
        let userAnswers = [];
        for (let i = 0; i < questionsData.length; i++) {
            const q = questionsData[i];
            if (q.type === 'single') {
                const selected = document.querySelector(`input[name="q${i}"]:checked`);
                userAnswers.push(selected ? [selected.value] : []);
            } 
            else if (q.type === 'multiple') {
                const checkboxes = document.querySelectorAll(`input[name="q${i}_cb"]:checked`);
                let vals = Array.from(checkboxes).map(cb => cb.value);
                userAnswers.push(vals);
            } 
            else if (q.type === 'text') {
                const inputField = document.getElementById(`text-${i}`);
                let val = inputField ? inputField.value.trim() : '';
                userAnswers.push(val);
            }
        }
        return userAnswers;
    }

    // нармалізацыя для тэкставых адказаў
    function normalizeText(str) {
        if (!str) return '';
        let normalized = str.trim().toLowerCase();
        normalized = normalized.replace(/['’`]/g, "'");
        return normalized;
    }

    function isTextAnswerCorrect(userAnswer, correctArr) {
        if (!userAnswer) return false;
        const normUser = normalizeText(userAnswer);
        return correctArr.some(correct => normalizeText(correct) === normUser);
    }

    function checkQuiz() {
        const userAnswers = getUserAnswers();
        let totalScore = 0;
        let details = [];

        for (let i = 0; i < questionsData.length; i++) {
            const q = questionsData[i];
            let isCorrect = false;
            let userStr = '';
            let correctStr = '';

            if (q.type === 'single') {
                const userSel = userAnswers[i];
                const correctVal = q.correct[0];
                userStr = userSel.length ? userSel[0] : '(не выбрана)';
                correctStr = correctVal;
                isCorrect = (userSel.length === 1 && userSel[0] === correctVal);
                if (isCorrect) totalScore++;
            } 
            else if (q.type === 'multiple') {
                const userSet = new Set(userAnswers[i]);
                const correctSet = new Set(q.correct);
                let allCorrect = userSet.size === correctSet.size;
                if (allCorrect) {
                    for (let val of correctSet) {
                        if (!userSet.has(val)) { allCorrect = false; break; }
                    }
                }
                isCorrect = allCorrect;
                userStr = userAnswers[i].length ? userAnswers[i].join(', ') : '(нічога не выбрана)';
                correctStr = q.correct.join(', ');
                if (isCorrect) totalScore++;
            } 
            else if (q.type === 'text') {
                const userTxt = userAnswers[i];
                userStr = userTxt || '(не ўведзена)';
                correctStr = q.correct.join(' або ');
                isCorrect = isTextAnswerCorrect(userTxt, q.correct);
                if (isCorrect) totalScore++;
            }

            details.push({
                index: i,
                questionText: q.text,
                userAnswer: userStr,
                correctAnswer: correctStr,
                isCorrect: isCorrect,
                explanation: q.explanation
            });
        }

        // паказаць вынікі
        const resultsDiv = document.getElementById('resultsArea');
        let scoreHtml = `<div class="score">🎯 Ваш бал: ${totalScore} з ${questionsData.length}</div>`;
        let expHtml = `<div class="explanation"><strong>📖 Падрабязны разбор і правілы:</strong>`;
        for (let d of details) {
            const statusIcon = d.isCorrect ? '✅' : '❌';
            const statusClass = d.isCorrect ? 'correct-badge' : 'wrong-badge';
            expHtml += `<div class="exp-item">
                            <span class="${statusClass}">${statusIcon} Пытанне ${d.index+1}: ${d.questionText}</span><br>
                            <span style="font-weight:500;">Ваш адказ:</span> ${d.userAnswer}<br>
                            <span style="font-weight:500;">Правільны адказ:</span> ${d.correctAnswer}<br>
                            <span style="font-weight:500; color:#155f6b;">📘 Тлумачэнне:</span> ${d.explanation}
                        </div>`;
        }
        expHtml += `</div>`;
        resultsDiv.innerHTML = scoreHtml + expHtml;
        resultsDiv.style.display = 'block';
        window.scrollTo({ top: resultsDiv.offsetTop - 20, behavior: 'smooth' });
    }

    function resetForm() {
        // скінуць усе радыё і чэкбоксы
        const allRadios = document.querySelectorAll('input[type="radio"], input[type="checkbox"]');
        allRadios.forEach(el => el.checked = false);
        const allTexts = document.querySelectorAll('input[type="text"]');
        allTexts.forEach(el => el.value = '');
        const resultsDiv = document.getElementById('resultsArea');
        resultsDiv.style.display = 'none';
        resultsDiv.innerHTML = '';
    }

    // падзеі кнопак
    document.getElementById('checkBtn').addEventListener('click', checkQuiz);
    document.getElementById('resetBtn').addEventListener('click', resetForm);

    // рэндэрым форму (без аўтаматычнай праверкі)
    renderQuiz();
</script>
</body>
</html>
